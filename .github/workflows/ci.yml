name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[agents,db,embed,dev]"
      - name: Lint
        run: ruff check .
      # Tests marked `db` need a running pgvector database and are skipped here.
      - name: Unit tests
        run: python -m pytest -m "not db" -q
