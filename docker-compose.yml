services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: incidentiq
      POSTGRES_PASSWORD: incidentiq
      POSTGRES_DB: incidentiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentiq"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
